[package]
name = "tezbar-convert"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
regex = "1"
ryu-js = "1"
uuid = { version = "=1.23.3", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
